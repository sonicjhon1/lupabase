[package]
name = "lupabase"
version = "2.0.0-dev.3"
authors = ["sonicjhon1"]
edition = "2024"
description = "Blazingly fast (work-in-progress) database engine written entirely in Rust"
readme = "README.md"
repository = "https://github.com/sonicjhon1/lupabase"
license = "MIT OR Apache-2.0"
keywords = ["database", "embedded", "in-memory", "json", "storage-engine"]
categories = ["database-implementations"]

[lib]
path = "src/lib.rs"

[features]
default = ["hashmap", "disk", "transaction"]
full = [
    "cbor",
    "json",
    "postcard",
    "arcticmap",
    "dashmap",
    "disk",
    "hashmap",
    "transaction",
]
nightly = ["hashbrown/nightly", "parking_lot/nightly"]

# Formats
cbor = ["dep:minicbor-serde"]
json = ["dep:serde_json"]
postcard = ["dep:postcard2"]

# Engines
arcticmap = ["dep:arctic-map"]
dashmap = ["dep:dashmap"]
disk = []
hashmap = ["dep:hashbrown", "dep:parking_lot"]
transaction = ["hashmap"]

[dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
derive_more = { version = "2.1", features = ["display", "error"] }
itertools = "0.15"
parking_lot = { version = "0.13", features = [
    "hardware-lock-elision",
], optional = true }
serde_core = { version = "1.0.229" }
tracing = { version = "0.1", features = ["log"] }

# Formats
postcard2 = { version = "0.2", features = ["alloc", "std"], optional = true }
serde_json = { version = "1.0.151", optional = true }
minicbor-serde = { version = "0.7", features = ["full"], optional = true }

# Engines
arctic-map = { version = "0.1", optional = true }
dashmap = { version = "6.2", features = ["inline"], optional = true }
hashbrown = { version = "0.17", optional = true }

[dev-dependencies]
insta = { version = "1", features = ["filters", "ron"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = { version = "3", features = ["nightly"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# This is required to avoid conflict with other `serde` users which may require an older version.
[target.'cfg(any())'.dependencies]
serde = { version = "1.0.229", default-features = false, optional = true }

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
needless_return = "allow"
